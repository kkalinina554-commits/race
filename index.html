<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Микро-Гонка</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1420; touch-action:none;
    font-family:'Segoe UI',system-ui,sans-serif; user-select:none; -webkit-user-select:none; }
  #game { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #minimap { position:fixed; top:calc(8px + env(safe-area-inset-top)); left:calc(8px + env(safe-area-inset-left));
    width:120px; height:92px; border-radius:8px; opacity:.9; z-index:5; pointer-events:none; }
  #hud { position:fixed; top:calc(8px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    display:flex; gap:8px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); z-index:5; pointer-events:none; }
  #hud .box { background:rgba(0,0,0,.4); border-radius:10px; padding:5px 10px; font-size:14px; font-weight:800; }
  #posT { color:#ffd166; }
  #timeT { font-variant-numeric:tabular-nums; }
  #dash { position:fixed; top:calc(6px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right));
    width:170px; height:108px; z-index:5; pointer-events:none; }
  #resetBtn { position:fixed; right:calc(12px + env(safe-area-inset-right)); top:calc(120px + env(safe-area-inset-top)); z-index:6;
    width:40px; height:40px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
    background:rgba(0,0,0,.35); color:#fff; font-size:17px; touch-action:none; }

  #controls { position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; justify-content:space-between; padding:0 14px; z-index:6; }
  .cluster { display:flex; gap:12px; }
  .btn { width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.14);
    border:2px solid rgba(255,255,255,.35); color:#fff; font-size:28px; font-weight:700;
    display:flex; align-items:center; justify-content:center; touch-action:none; }
  .btn.big { width:82px; height:82px; background:rgba(80,200,120,.25); border-color:rgba(120,230,160,.5); }
  .btn.small { width:58px; height:58px; font-size:21px; }
  .btn.active { background:rgba(255,255,255,.35); }
  body.desktop .btn { opacity:.5; }

  #overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; background:rgba(8,14,26,.78);
    color:#fff; text-align:center; padding:20px; }
  #overlay h1 { font-size:32px; letter-spacing:2px; }
  #overlay .hint { font-size:14px; opacity:.8; line-height:1.6; max-width:420px; }
  #trackSel { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
  #diffSel { display:flex; gap:8px; justify-content:center; }
  .diffBtn { background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35); color:#fff;
    border-radius:10px; padding:9px 18px; font-size:15px; font-weight:800; cursor:pointer; }
  .diffBtn.on { background:#1d4ed8; border-color:#3b82f6; }
  .diffBtn:active { transform:scale(.97); }
  .trackBtn { background:linear-gradient(135deg,#1d4ed8,#2563eb); color:#fff; border:none;
    border-radius:14px; padding:14px 30px; font-size:18px; font-weight:800; cursor:pointer; min-width:260px; }
  .trackBtn:active { transform:scale(.97); }
  #bigMsg { font-size:76px; font-weight:900; white-space:pre-line; }
  #restartBtn, #menuBtn { display:none; pointer-events:auto; margin-top:2px;
    color:#fff; border:none; border-radius:12px; padding:12px 30px;
    font-size:17px; font-weight:800; cursor:pointer; }
  #restartBtn { background:#e63946; }
  #menuBtn { background:rgba(255,255,255,.2); }
  #restartBtn.show, #menuBtn.show { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap" width="120" height="92"></canvas>

<div id="hud">
  <div class="box" id="lapT">КРУГ 1/3</div>
  <div class="box" id="posT">4/4</div>
  <div class="box" id="timeT">0.00</div>
</div>
<canvas id="dash" width="340" height="216"></canvas>
<button id="resetBtn" title="На трассу">⟳</button>

<div id="controls">
  <div class="cluster">
    <div class="btn" id="btnL">◀</div>
    <div class="btn" id="btnR">▶</div>
  </div>
  <div class="cluster">
    <div class="btn small" id="btnB">⬇</div>
    <div class="btn big" id="btnG">▲</div>
  </div>
</div>

<div id="overlay">
  <h1>МИКРО-ГОНКА</h1>
  <div id="diffSel">
    <button class="diffBtn" data-diff="easy">🐢 ЛЕГКО</button>
    <button class="diffBtn on" data-diff="norm">🏎 НОРМА</button>
    <button class="diffBtn" data-diff="hard">🔥 ХАРД</button>
  </div>
  <div id="trackSel">
    <button class="trackBtn" data-track="circuit">🏁 КОЛЬЦО — заезд на 3 круга</button>
    <button class="trackBtn" data-track="sprint">🚀 СПРИНТ — до флага, в один конец</button>
  </div>
  <p class="hint">ПК: стрелки или WASD.<br>Телефон: кнопки ◀ ▶ и газ/тормоз.<br>С травы — медленно! Выбери сложность и жми трассу.</p>
  <div id="bigMsg"></div>
  <button id="restartBtn">ЕЩЁ РАЗ</button>
  <button id="menuBtn">СМЕНИТЬ ТРАССУ</button>
</div>

<script>
(() => {
'use strict';

/* ================= общие утилиты ================= */
function normAngle(a) { return ((a + Math.PI*3) % (Math.PI*2)) - Math.PI; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

/* ================= определения трасс ================= */
const ROAD_W_CIRCUIT = 92;
const ROAD_W_SPRINT = 110;
const TRACKS = {
  circuit: {
    name: 'КОЛЬЦО', closed: true, laps: 3, roadW: ROAD_W_CIRCUIT,
    worldW: 2400, worldH: 1800,
    control: [
      [420,1300],[300,950],[380,560],[700,340],[1100,270],[1500,330],
      [1830,520],[2040,840],[1940,1180],[1600,1330],[1240,1210],[960,1270],
      [830,1470],[640,1510]
    ]
  },
  sprint: {
    name: 'СПРИНТ', closed: false, laps: 1, roadW: ROAD_W_SPRINT,
    worldW: 3700, worldH: 2000,
    control: [
      [240,1650],[650,1400],[520,950],[900,650],[1350,780],[1450,1150],
      [1850,1250],[2150,950],[2100,550],[2600,420],[2950,700],[3350,600],[3500,250]
    ]
  }
};

function sampleCenterline(control, closed, seg) {
  const pts = [];
  const n = control.length;
  const getP = i => closed ? control[(i+n)%n] : control[clamp(i,0,n-1)];
  const last = closed ? n : n-1;
  for (let i = 0; i < last; i++) {
    const p0 = getP(i-1), p1 = control[i], p2 = getP(i+1), p3 = getP(i+2);
    for (let j = 0; j < seg; j++) {
      const t = j/seg, t2 = t*t, t3 = t2*t;
      pts.push({
        x: .5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        y: .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      });
    }
  }
  return pts;
}

/* ================= сборка трассы ================= */
let T = null;
let currentTrack = 'circuit';

function buildTrack(kind) {
  currentTrack = kind;
  const def = TRACKS[kind];
  const W = def.worldW, H = def.worldH, RW = def.roadW;
  const SEG = 26;
  const pts = sampleCenterline(def.control, def.closed, SEG);
  const N = pts.length;
  const tang = [], norm = [];
  for (let i = 0; i < N; i++) {
    const a = pts[def.closed ? (i+N-1)%N : Math.max(0,i-1)];
    const b = pts[def.closed ? (i+1)%N : Math.min(N-1,i+1)];
    let dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy) || 1;
    dx/=len; dy/=len;
    tang.push({x:dx,y:dy});
    norm.push({x:-dy,y:dx});
  }
  let trackLen = 0;
  for (let i = 0; i < N-1; i++) trackLen += Math.hypot(pts[i+1].x-pts[i].x, pts[i+1].y-pts[i].y);
  if (def.closed) {
    trackLen += Math.hypot(pts[0].x-pts[N-1].x, pts[0].y-pts[N-1].y);
  }
  const AVG_SP = trackLen/(def.closed ? N : N-1);

  const trackCv = document.createElement('canvas');
  trackCv.width = W; trackCv.height = H;
  const maskCv = document.createElement('canvas');
  maskCv.width = W; maskCv.height = H;

  const g = trackCv.getContext('2d');
  g.fillStyle = '#3d7a33';
  g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(0,0,0,.06)';
  g.lineWidth = 60;
  for (let y = 0; y < H; y += 120) {
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
  }
  const road = new Path2D();
  road.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < N; i++) road.lineTo(pts[i].x, pts[i].y);
  if (def.closed) road.closePath();

  g.lineJoin = 'round'; g.lineCap = 'round';
  g.strokeStyle = '#dfe2e6'; g.lineWidth = RW + 10; g.stroke(road);   // светлый край
  g.strokeStyle = '#454a52'; g.lineWidth = RW;      g.stroke(road);   // асфальт
  g.setLineDash([26,30]);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.stroke(road); // разметка
  g.setLineDash([]);

  const drawChecker = (idx) => {
    const p = pts[idx], nrm = norm[idx];
    for (let k = -3; k <= 3; k++) {
      const off = k * 13;
      g.fillStyle = (k % 2) ? '#ffffff' : '#222222';
      g.save();
      g.translate(p.x + nrm.x*off, p.y + nrm.y*off);
      g.rotate(Math.atan2(tang[idx].y, tang[idx].x));
      g.fillRect(-10, -7.5, 20, 15);
      g.restore();
    }
  };
  drawChecker(0);
  if (!def.closed) drawChecker(N-1);

  const m = maskCv.getContext('2d');
  m.strokeStyle = '#ff0000'; m.lineJoin = 'round'; m.lineCap = 'round';
  m.lineWidth = RW;
  m.stroke(new Path2D(road));

  const maskData = m.getImageData(0,0,W,H).data;

  return {
    kind, def, closed: def.closed, laps: def.laps, roadW: RW,
    worldW: W, worldH: H,
    pts, N, tang, norm, AVG_SP, trackLen, maskData,
    trackCv,
    finishIdx: def.closed ? 0 : N-1
  };
}

function onRoad(x, y) {
  const xi = x|0, yi = y|0;
  if (xi < 0 || yi < 0 || xi >= T.worldW || yi >= T.worldH) return false;
  return T.maskData[(yi*T.worldW + xi)*4] > 100;
}

/* ================= уровни сложности ================= */
const DIFFS = {
  easy: { base: 190, spread: 15, cornerK: 0.75, cap: 150, chaseBase: 15, chaseMax: 70 },
  norm: { base: 365, spread: 15, cornerK: 0.6, cap: 260, chaseBase: 25, chaseMax: 100 },
  hard: { base: 400, spread: 25, cornerK: 0.35, cap: 320, chaseBase: 35, chaseMax: 120 }
};
let diffName = localStorage.getItem('racer_diff') || 'norm';
if (!DIFFS[diffName]) diffName = 'norm';
let D = DIFFS[diffName];

/* ================= машины ================= */
function makeRacer(color, gridSlot, isPlayer) {
  const closed = T.closed;
  const idx = closed ? (T.N - 12 - gridSlot*7 + T.N) % T.N
                     : Math.min(T.N - 2, 8 + gridSlot*7);
  const LANE = T.roadW*0.27;
  const off = gridSlot <= 1 ? (gridSlot === 0 ? 0 : LANE) : (gridSlot === 2 ? -LANE : 0);
  return {
    isPlayer, color,
    x: T.pts[idx].x + T.norm[idx].x*off,
    y: T.pts[idx].y + T.norm[idx].y*off,
    angle: Math.atan2(T.tang[idx].y, T.tang[idx].x),
    speed: 0,
    idx, totalProg: closed ? -12 - gridSlot*7 : idx,
    completed: 0, nextCp: 1,
    lateral: off, baseLat: off, vmax: isPlayer ? 0 : (D.base + Math.random()*D.spread),
    lapStart: 0
  };
}
const COLORS = ['#e63946','#4477dd','#f2c14e','#9b5de5'];
let racers, player;
let state = 'menu';                 // menu | countdown | race | finished
let countdownT = 0, raceTime = 0;
let bestLap = parseFloat(localStorage.getItem('racer_best')) || null;
let finishedOrder = [];

function resetRace() {
  racers = [];
  player = makeRacer(COLORS[0], 0, true);
  for (let i = 0; i < 3; i++) racers.push(makeRacer(COLORS[i+1], i+1, false));
  racers.push(player);
  raceTime = 0; finishedOrder = [];
  camX = player.x; camY = player.y;
}

/* ================= ввод ================= */
const keys = {};
addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);

const btnState = { L:false, R:false, G:false, B:false };
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const set = v => e => { e.preventDefault(); btnState[key] = v; el.classList.toggle('active', v); };
  el.addEventListener('pointerdown', set(true));
  el.addEventListener('pointerup', set(false));
  el.addEventListener('pointercancel', set(false));
  el.addEventListener('pointerleave', set(false));
}
bindBtn('btnL','L'); bindBtn('btnR','R'); bindBtn('btnG','G'); bindBtn('btnB','B');
if (!('ontouchstart' in window)) document.body.classList.add('desktop');

/* ================= элементы HUD ================= */
const $ = id => document.getElementById(id);
const overlay = $('overlay'), bigMsg = $('bigMsg');
const trackSel = $('trackSel'), restartBtn = $('restartBtn'), menuBtn = $('menuBtn');
const h1El = document.querySelector('#overlay h1');
const hintEl = document.querySelector('#overlay .hint');

function selectTrack(kind) {
  T = buildTrack(kind);
  localStorage.setItem('racer_track', kind);
  startCountdown();
}
document.querySelectorAll('.trackBtn').forEach(b =>
  b.addEventListener('click', () => selectTrack(b.dataset.track)));
const diffSel = $('diffSel');
function paintDiff() {
  diffSel.querySelectorAll('.diffBtn').forEach(b =>
    b.classList.toggle('on', b.dataset.diff === diffName));
}
diffSel.querySelectorAll('.diffBtn').forEach(b =>
  b.addEventListener('click', () => {
    diffName = b.dataset.diff;
    D = DIFFS[diffName];
    localStorage.setItem('racer_diff', diffName);
    paintDiff();
  }));
paintDiff();
restartBtn.addEventListener('click', () => startCountdown());
menuBtn.addEventListener('click', showMenu);

function showMenu() {
  state = 'menu';
  overlay.style.display = 'flex';
  trackSel.style.display = 'flex';
  diffSel.style.display = 'flex';
  restartBtn.classList.remove('show');
  menuBtn.classList.remove('show');
  bigMsg.textContent = '';
  h1El.style.display = '';
  hintEl.style.display = '';
}
function startCountdown() {
  resetRace();
  state = 'countdown'; countdownT = 3.6;
  overlay.style.display = 'none';
}
$('resetBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  let best = 0, bd = 1e18;
  for (let i = 0; i < T.N; i++) {
    const d = (T.pts[i].x-player.x)**2 + (T.pts[i].y-player.y)**2;
    if (d < bd) { bd = d; best = i; }
  }
  player.x = T.pts[best].x; player.y = T.pts[best].y;
  player.angle = Math.atan2(T.tang[best].y, T.tang[best].x);
  player.speed = 0;
});

/* ================= физика игрока ================= */
const MAXV = 340, MAXV_GRASS = 150;
function updatePlayer(dt) {
  const gas  = keys.ArrowUp || keys.KeyW || btnState.G;
  const back = keys.ArrowDown || keys.KeyS || btnState.B;
  const left = keys.ArrowLeft || keys.KeyA || btnState.L;
  const right= keys.ArrowRight || keys.KeyD || btnState.R;
  const steer = (right?1:0) - (left?1:0);

  const onTrack = onRoad(player.x, player.y);
  const vlim = onTrack ? MAXV : MAXV_GRASS;

  if (state === 'race') {
    if (back) player.speed -= 520*dt;
    else if (gas) player.speed += (onTrack ? 330 : 200)*dt;
    else player.speed -= 60*dt;
  }
  player.speed -= player.speed * (onTrack ? 0.55 : 1.6) * dt;
  if (back && player.speed < 0) player.speed = Math.max(player.speed, -90);
  player.speed = Math.max(Math.min(player.speed, vlim), -90);

  const grip = Math.min(1, Math.abs(player.speed)/70);
  player.angle += steer * 2.9 * grip * dt * (player.speed < 0 ? -1 : 1);

  player.x += Math.cos(player.angle)*player.speed*dt;
  player.y += Math.sin(player.angle)*player.speed*dt;
  player.x = Math.max(20, Math.min(T.worldW-20, player.x));
  player.y = Math.max(20, Math.min(T.worldH-20, player.y));
}

/* ================= БИ ================= */
function updateAI(ai, dt) {
  if (state !== 'race' && state !== 'finished') return;                        // после финиша игрока боты продолжают гонку
  const i = Math.floor(ai.idx);
  const l1 = T.closed ? (i + 16) % T.N : Math.min(T.N - 1, i + 16);
  const l2 = T.closed ? (i + 34) % T.N : Math.min(T.N - 1, i + 34);
  const a1 = Math.atan2(T.tang[i].y, T.tang[i].x);
  const a2 = Math.atan2(T.pts[l2].y - T.pts[l1].y, T.pts[l2].x - T.pts[l1].x);
  const curv = Math.abs(normAngle(a1 - a2));
  const cornerT = ai.vmax / (1 + curv*D.cornerK);
  const gap = ai.totalProg - player.totalProg;
  const distP = Math.hypot(ai.x - player.x, ai.y - player.y);
  let target = cornerT;
  if (gap < -50) {
    const chase = Math.min(D.chaseMax, -gap*0.25);
    target = Math.max(target, Math.min(cornerT, player.speed) + D.chaseBase + chase);   // догоняет и пытается вырваться
  } else if (gap > 5) {
    target = gap > 100 ? Math.min(target, player.speed + 20)                   // далеко впереди — потихоньку
                       : Math.max(target, player.speed);                       // чуть впереди — темп не сбавляем
  }
  if (gap > D.cap - 60) {                                                      // самокорректирующийся потолок отрыва
    const room = Math.max(0, (D.cap + 40) - gap);
    target = room > 0 ? Math.min(target, player.speed + room*0.25)
                      : Math.min(target, player.speed * 0.5);
  }
  target = Math.min(target, ai.vmax);                                          // свой потолок важнее любых бонусов

  /* ближний бой: смещаемся на свободную сторону и проходим мимо */
  const jj = Math.floor(ai.idx);
  const relX = player.x - T.pts[jj].x, relY = player.y - T.pts[jj].y;
  const playLat = relX*T.norm[jj].x + relY*T.norm[jj].y;
  const LANE = T.roadW*0.27;
  let wantLat = ai.baseLat;
  if (distP < 80 && gap < 5) {
    wantLat = playLat > 0 ? -LANE : LANE;                                      // объезд со свободной стороны
    target = Math.min(ai.vmax, Math.max(cornerT, player.speed + 60));                            // решительный рывок на обгон
  }
  ai.lateral += (wantLat - ai.lateral) * Math.min(1, 6*dt);

  target = Math.max(0, target);
  ai.speed += clamp((target - ai.speed)*3*dt, -520*dt, 620*dt);
  const adv = ai.speed*dt/T.AVG_SP;
  ai.idx += adv;
  if (T.closed) ai.idx = ai.idx % T.N;
  else ai.idx = Math.min(T.N - 1.0001, ai.idx);
  ai.totalProg += adv;
  const j = Math.floor(ai.idx);
  ai.x = T.pts[j].x + T.norm[j].x*ai.lateral;
  ai.y = T.pts[j].y + T.norm[j].y*ai.lateral;
  const tAng = Math.atan2(T.tang[j].y, T.tang[j].x);
  ai.angle += normAngle(tAng - ai.angle) * Math.min(1, 14*dt);
}

/* ================= круги, прогресс, позиции ================= */
const CP = [0.25, 0.5, 0.75];
function updateProgress(r, dt, now) {
  if (r.isPlayer) {
    const near = nearestIdx(r.x, r.y, r.idx);
    let d = near - r.idx;
    if (d >  T.N/2) d -= T.N;
    if (d < -T.N/2) d += T.N;
    r.idx = (r.idx + d + T.N) % T.N;
    r.totalProg += d;
  }
  if (r.finished) return;
  const lapPos = r.totalProg;
  if (r.nextCp <= 3 && lapPos >= r.completed*T.N + T.N*CP[r.nextCp-1]) r.nextCp++;
  const finishLine = T.closed ? (r.completed+1)*T.N : T.N-1;
  if (r.nextCp === 4 && lapPos >= finishLine) {
    r.nextCp = 1; r.completed++;
    if (r.isPlayer) {
      const lapT = now - r.lapStart;
      r.lapStart = now;
      if (T.closed && r.completed < T.laps) flash('КРУГ ' + r.completed + '/' + T.laps + ' ✓  ' + lapT.toFixed(2) + 'с');
      else if (!T.closed) flash('ФИНИШ! ' + lapT.toFixed(2) + 'с');
      if (T.closed && (!bestLap || lapT < bestLap)) { bestLap = lapT; localStorage.setItem('racer_best', bestLap); }
      if (r.completed >= T.laps) finishRacer(r, now);
    } else if (r.completed >= T.laps) {
      finishRacer(r, now);
    }
  }
  if (r.isPlayer && r.completed >= T.laps) finishRacer(r, now);
}
function finishRacer(r, now) {
  if (r.finished) return;
  r.finished = true;
  r.finishTime = raceTime;
  finishedOrder.push(r);
  if (r.isPlayer) showResults();
}
function nearestIdx(x, y, hint) {
  let bi = hint|0, bd = 1e18;
  for (let k = -18; k <= 18; k++) {
    const i = ((hint + k) % T.N + T.N) % T.N | 0;
    const d = (T.pts[i].x-x)**2 + (T.pts[i].y-y)**2;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}
function rankOf(r) {
  let rank = 1;
  const rPos = r.finished ? 1e9 + finishedOrder.indexOf(r) : r.totalProg;
  for (const o of racers) {
    if (o === r) continue;
    const oPos = o.finished ? 1e9 + finishedOrder.indexOf(o) : o.totalProg;
    if (oPos > rPos) rank++;
  }
  return rank;
}
function rankName(place) {
  return ['1-Й','2-Й','3-Й','4-Й'][place-1] || (place + '-Й');
}

/* ================= столкновения игрок-БИ ================= */
function separateCars(dt) {
  for (const o of racers) {
    if (o === player) continue;
    const dx = player.x-o.x, dy = player.y-o.y;
    const d = Math.hypot(dx,dy);
    if (d < 28 && d > 0.01) {
      const push = (28-d)*0.5;
      player.x += dx/d*push; player.y += dy/d*push;
      const j = ((Math.floor(o.idx) % T.N) + T.N) % T.N;
      const latPush = (dx/d*T.norm[j].x + dy/d*T.norm[j].y) * push * 2.5;
      o.lateral = clamp(o.lateral - latPush, -T.roadW*0.4, T.roadW*0.4);
      o.x = T.pts[j].x + T.norm[j].x*o.lateral;
      o.y = T.pts[j].y + T.norm[j].y*o.lateral;
      if (d < 20) o.speed *= 1 - 3*dt;                                         // штраф боту — только за прямой таран
      player.speed *= 1 - 1.5*dt;
    }
  }
}

/* ================= вид сверху ================= */
const canvas = $('game');
const ctx = canvas.getContext('2d');
const mm = $('minimap');
const mmCtx = mm.getContext('2d');
let camX = 0, camY = 0, zoom = 1, flashT = 0, flashTxt = '';
function flash(txt) { flashTxt = txt; flashT = 1.6; }

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth*dpr; canvas.height = innerHeight*dpr;
  canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  zoom = clamp(Math.min(innerWidth, innerHeight)/900, 0.3, 1.4);
}
addEventListener('resize', resize);
resize();

function render2D(dt) {
  const k = Math.min(1, 10*dt);
  camX += (player.x - camX)*k;
  camY += (player.y - camY)*k;

  const cw = innerWidth, ch = innerHeight;
  const vw = cw/zoom, vh = ch/zoom;
  let cx = camX, cy = camY;
  if (T.worldW > vw) cx = clamp(cx, vw/2, T.worldW - vw/2); else cx = T.worldW/2;
  if (T.worldH > vh) cy = clamp(cy, vh/2, T.worldH - vh/2); else cy = T.worldH/2;

  ctx.fillStyle = '#0d1420';
  ctx.fillRect(0,0,cw,ch);
  ctx.save();
  ctx.translate(cw/2, ch/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-cx, -cy);
  ctx.drawImage(T.trackCv, 0, 0);

  /* игрок рисуется последним — поверх ботов */
  const list = racers.slice().sort((a,b) => (a === player) - (b === player));
  for (const r of list) drawCarTop(r);
  ctx.restore();
}

function drawCarTop(r) {
  const w = 30, h = 17;
  ctx.save();
  ctx.translate(r.x, r.y);
  ctx.rotate(r.angle);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.roundRect(-w*0.5 + 2, -h*0.5 + 2, w, h, 5); ctx.fill();
  ctx.fillStyle = r.color;
  ctx.beginPath(); ctx.roundRect(-w*0.5, -h*0.5, w, h, 5); ctx.fill();
  ctx.fillStyle = 'rgba(18,28,44,.9)';
  ctx.beginPath(); ctx.roundRect(w*0.08, -h*0.32, w*0.22, h*0.64, 2); ctx.fill();
  ctx.fillStyle = '#fdf5ae';
  ctx.fillRect(w*0.32, -h*0.38, 3, 3);
  ctx.fillRect(w*0.32, h*0.38 - 3, 3, 3);
  ctx.restore();
}

/* ================= мини-карта ================= */
const mmBg = document.createElement('canvas');
mmBg.width = 120; mmBg.height = 92;
let mmScale = 1;
function buildMinimap() {
  const g = mmBg.getContext('2d');
  g.clearRect(0,0,120,92);
  g.fillStyle = 'rgba(0,0,0,.4)';
  g.fillRect(0,0,120,92);
  mmScale = Math.min(120/T.worldW, 92/T.worldH);
  g.save();
  g.scale(mmScale,mmScale);
  g.drawImage(T.trackCv,0,0);
  g.restore();
}

function renderMinimap() {
  mmCtx.clearRect(0,0,120,92);
  mmCtx.drawImage(mmBg,0,0);
  for (const r of racers) {
    if (r === player) continue;
    mmCtx.fillStyle = r.color;
    mmCtx.fillRect(r.x*mmScale-1.5, r.y*mmScale-1.5, 3, 3);
  }
  mmCtx.fillStyle = '#fff';
  mmCtx.beginPath();
  mmCtx.arc(player.x*mmScale, player.y*mmScale, 2.6, 0, 7);
  mmCtx.fill();
  if (!T.closed) {
    const f = T.pts[T.finishIdx];
    mmCtx.fillStyle = '#ffd166';
    mmCtx.fillRect(f.x*mmScale-2, f.y*mmScale-2, 5, 5);
  }
}

/* ================= приборная панель ================= */
const dash = $('dash');
const dashCtx = dash.getContext('2d');
const DMX = 85, DMY = 78, DR = 62;      // центр и радиус спидометра (в координатах 170x108 -> x2)
const KMH_UNIT = 1.15;
const KMH_MAX = 400;

function drawDash() {
  const c = dashCtx;
  c.clearRect(0,0,340,216);
  const v = Math.abs(player.speed)*KMH_UNIT;

  const a0 = Math.PI*0.75, a1 = Math.PI*2.25;
  function angOf(frac) { return a0 + (a1-a0)*clamp(frac,0,1); }

  c.beginPath();
  c.arc(DMX*2, DMY*2, (DR+14)*2, 0, 7);
  c.fillStyle = 'rgba(5,10,20,.55)';
  c.fill();

  c.lineWidth = 10; c.lineCap = 'butt';
  c.strokeStyle = 'rgba(255,255,255,.18)';
  c.beginPath(); c.arc(DMX*2, DMY*2, DR*2, a0, a1); c.stroke();

  for (let s = 0; s <= KMH_MAX; s += 40) {
    const a = angOf(s/KMH_MAX);
    const big = s % 80 === 0;
    c.strokeStyle = big ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.4)';
    c.lineWidth = big ? 3 : 1.5;
    const r1 = (DR-6)*2, r2 = (DR - (big ? 14 : 10))*2;
    c.beginPath();
    c.moveTo(DMX*2 + Math.cos(a)*r1, DMY*2 + Math.sin(a)*r1);
    c.lineTo(DMX*2 + Math.cos(a)*r2, DMY*2 + Math.sin(a)*r2);
    c.stroke();
    if (big && s % 160 === 0) {
      c.fillStyle = 'rgba(255,255,255,.75)';
      c.font = '700 11px system-ui';
      c.textAlign = 'center';
      c.fillText(String(s), DMX*2 + Math.cos(a)*(DR-26)*2, DMY*2 + Math.sin(a)*(DR-26)*2 + 4);
    }
  }

  const af = angOf(v/KMH_MAX);
  c.strokeStyle = v > (KMH_MAX*0.72) ? '#ff4757' : '#7bed9f';
  c.lineWidth = 10;
  c.beginPath(); c.arc(DMX*2, DMY*2, DR*2, angOf(0), af); c.stroke();

  c.strokeStyle = '#fff'; c.lineWidth = 3.5; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(DMX*2 - Math.cos(af)*10, DMY*2 - Math.sin(af)*10);
  c.lineTo(DMX*2 + Math.cos(af)*(DR-16)*2, DMY*2 + Math.sin(af)*(DR-16)*2);
  c.stroke();
  c.beginPath(); c.arc(DMX*2, DMY*2, 4, 0, 7);
  c.fillStyle = '#e63946'; c.fill();

  const gear = player.speed < -5 ? 'R' : (v < 4 ? 'N' : String(Math.min(6, 1 + Math.floor(v/62))));
  c.fillStyle = '#fff';
  c.font = '800 30px system-ui';
  c.textAlign = 'center';
  c.fillText(gear, DMX*2, DMY*2 + 26);
  c.font = '700 11px system-ui';
  c.fillStyle = 'rgba(255,255,255,.6)';
  c.fillText('км/ч', DMX*2, DMY*2 + 44);
  c.fillStyle = '#fff';
  c.font = '800 20px system-ui';
  c.fillText(String(Math.round(v)), DMX*2, DMY*2 - 14);

  /* тахометр — тонкая дуга сверху внутри */
  const gearV = 62;
  const rpm = v < 4 ? 0.05 : clamp((v % gearV)/gearV, 0, 1);
  const ra0 = Math.PI*0.86, ra1 = Math.PI*2.14;
  c.lineWidth = 6;
  c.strokeStyle = 'rgba(255,255,255,.15)';
  c.beginPath(); c.arc(DMX*2, DMY*2, (DR-20)*2, ra0, ra1); c.stroke();
  const grad = rpm > 0.85 ? '#ff4757' : (rpm > 0.6 ? '#ffa502' : '#70d6ff');
  c.strokeStyle = grad; c.lineWidth = 6;
  c.beginPath(); c.arc(DMX*2, DMY*2, (DR-20)*2, ra0, ra0 + (ra1-ra0)*rpm); c.stroke();
}

/* ================= HUD ================= */
function updateHud(now) {
  if (T.closed) {
    $('lapT').textContent = 'КРУГ ' + Math.min(player.completed+1,T.laps) + '/' + T.laps;
  } else {
    const pct = clamp(player.totalProg/(T.N-1), 0, 1);
    $('lapT').textContent = 'ДО ФЛАГА ' + Math.round((1-pct)*100) + '%';
  }
  $('posT').textContent = rankOf(player) + '/4';
  $('timeT').textContent = raceTime.toFixed(2);
}

function showResults() {
  state = 'finished';
  overlay.style.display = 'flex';
  const place = finishedOrder.indexOf(player) + 1;
  h1El.style.display = 'none';
  hintEl.style.display = 'none';
  trackSel.style.display = 'none';
  diffSel.style.display = 'none';
  restartBtn.classList.add('show');
  menuBtn.classList.add('show');
  bigMsg.style.fontSize = '48px';
  bigMsg.textContent = (place === 1 ? '🏆 ПОБЕДА!' : rankName(place) + ' МЕСТО') +
    (bestLap && T.closed ? '\nЛучший круг: ' + bestLap.toFixed(2) + 'с' : '') +
    '\nВремя: ' + raceTime.toFixed(2) + 'с';
}

/* ================= главный цикл ================= */
let last = performance.now();
function loop(nowMs) {
  const now = nowMs/1000;
  const dt = Math.min(0.05, now - last);
  last = now;

  if (state === 'countdown') {
    countdownT -= dt;
    overlay.style.display = 'flex';
    h1El.style.display = 'none';
    document.querySelector('#overlay .hint').style.display = 'none';
    restartBtn.classList.remove('show'); menuBtn.classList.remove('show');
    bigMsg.style.fontSize = '76px';
    const c = Math.ceil(countdownT - 0.6);
    bigMsg.textContent = c > 0 ? c : 'ПОЕХАЛИ!';
    if (countdownT <= 0) {
      state = 'race';
      overlay.style.display = 'none';
      for (const r of racers) r.lapStart = now;
    }
  }

  if (state === 'race' || state === 'finished') {
    if (state === 'race') raceTime += dt;
    updatePlayer(dt);
    for (const r of racers) {
      if (r.isPlayer) continue;
      if (r.finished) aiCoast(r, dt);
      else updateAI(r, dt);
      updateProgress(r, dt, now);
    }
    separateCars(dt);
    updateProgress(player, dt, now);
    if (flashT > 0) flashT -= dt;
  }

  if (state !== 'menu') {
    render2D(dt);
    renderMinimap();
    drawDash();
    updateHud(now);
    if (flashT > 0) {
      ctx.font = '800 30px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, flashT) + ')';
      ctx.fillText(flashTxt, innerWidth/2, innerHeight*0.3);
    }
  }

  requestAnimationFrame(loop);
}

function aiCoast(r, dt) {
  r.speed += (0 - r.speed) * 2 * dt;
  r.x += Math.cos(r.angle)*r.speed*dt;
  r.y += Math.sin(r.angle)*r.speed*dt;
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    const rr = Math.min(r, w/2, h/2);
    this.moveTo(x+rr, y);
    this.arcTo(x+w, y, x+w, y+h, rr);
    this.arcTo(x+w, y+h, x, y+h, rr);
    this.arcTo(x, y+h, x, y, rr);
    this.arcTo(x, y, x+w, y, rr);
    this.closePath();
    return this;
  };
}

T = buildTrack(localStorage.getItem('racer_track') || 'circuit');
buildMinimap();
resetRace();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
